// Says hello, one person or many.
syntax = "proto3";

package helloworld.v1;

service Greeter {
  // Greets one person.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  // Greets everyone in the list.
  rpc SayHelloToAll (HelloAllRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloAllRequest {
  repeated string names = 1;
}

message HelloReply {
  string message = 1;
}
