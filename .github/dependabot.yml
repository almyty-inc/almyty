# Dependabot configuration for continuous dependency patching.
#
# Opens automated PRs against the `development` branch (the integration
# branch — dev promotes to staging then master; deps must flow the same
# path, never land straight on master). Combined with the `npm audit` +
# Trivy jobs in .github/workflows/ci.yml, this is the other half of a
# working dependency-hygiene story: CI catches KNOWN vulnerable versions
# on every PR, and Dependabot keeps proposing the patches that make CI
# pass.
#
# Scope:
#
#   - backend + frontend + docs-site: npm ecosystem, monthly cadence
#     (a critical advisory still lands within a few weeks, and one
#     grouped PR a month keeps the review queue quiet)
#
#   - .github/workflows: GitHub Actions versions. actions/checkout and
#     actions/setup-node majors are IGNORED — they're intentionally
#     pinned at v6 per the repo's Deploy Pins (CLAUDE.md); Dependabot
#     kept reopening v7 bumps that we have to close by hand.
#
#   - docker: the Dockerfile FROM lines for backend / frontend /
#     docs-site. Base image updates (Alpine CVEs, Node security
#     releases) otherwise get noticed only when someone manually
#     runs Trivy against a deploy months later.
#
# Opens max 5 PRs per ecosystem at a time so a lock-file regen burst
# doesn't overwhelm review. Each npm ecosystem groups ALL version bumps
# (major + minor + patch) into a single monthly PR, so a whole month of
# updates lands as one green branch instead of a dozen separate PRs.
# Security advisories still open as their own PRs regardless of grouping.
version: 2
updates:
  # ── Backend (NestJS API) ────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # Backend uses the TypeScript compiler API (SDK introspector).
      # TS 7 restructures the package so `import * as ts from 'typescript'`
      # no longer exports Symbol/TypeChecker. Needs a dedicated port.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # v9 is ESM-only and Jest cannot load it.
      - dependency-name: "oauth2-mock-server"
        update-types: ["version-update:semver-major"]
      # Nest 12 ships ESM-only packages: `"type": "module"` with an
      # exports map that no longer resolves `@nestjs/common/interfaces`
      # under this project's `module: commonjs` tsconfig, so every
      # third-party Nest module's `Pick<ModuleMetadata, 'imports'>`
      # silently degrades to a required `any`. Terminus 12 additionally
      # drops the `HealthIndicator` base class and `HealthCheckError`.
      # And the Nest modules we depend on (@nest-lab/throttler-storage-redis,
      # @nestjs-modules/ioredis) still cap their peer range at ^11.
      # Moving to 12 is an ESM migration of the whole backend, not a
      # version bump — it needs its own PR, not a monthly group. This
      # arrived inside the group below in #674 and broke development.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # v13 depends on an ESM-only @apidevtools/json-schema-ref-parser, so
      # CommonJS Jest fails with "Must use import to load ES Module" and
      # the whole backend suite stops loading. Pinned to 12 in #682; this
      # ignore was missing, so dependabot re-proposed 13 as #691 within
      # the hour. Moves with the same ESM migration as Nest 12.
      - dependency-name: "@apidevtools/swagger-parser"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ── Frontend (React/Vite) ───────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Table v9 is a breaking API (getCoreRowModel is not a function).
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # jsdom is pinned exactly in package.json, not caret-ranged: 30.1.0
      # leaks state across tests in the same file for Radix modal layers
      # (a dropdown opened in one test stops opening in the next), which
      # failed 19 tests across 9 files in #673. It is a MINOR bump, so a
      # major-only ignore would not hold it. Unpin only together with a
      # diagnosis of the 30.1 change; the app itself never runs on jsdom.
      - dependency-name: "jsdom"
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ── Docs site (Nextra) ──────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/docs-site"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docs"
    ignore:
      # Next.js 16 still needs the TypeScript 6 compiler API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      docs-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ── GitHub Actions workflow pins ────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Pinned at v6 per Deploy Pins (CLAUDE.md) — do not bump majors.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]

  # ── Dockerfiles ─────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docs-site"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  # Repo root: Dockerfile.allinone (the single self-host image,
  # almyty/almyty). Left uncovered, it sat on node:24-alpine for two
  # majors after every other image moved to 26 — a self-hoster was
  # running a different Node than the one the code is tested on, and
  # nothing said so. scripts/check-node-version.js now fails CI on that
  # drift; this entry is what keeps the bump arriving on its own.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
