name: Publish npm Packages

# Publishes the twelve @almyty/* packages (docs/releasing.md).
#
# Versions are not bumped here. Contributors add a changeset, the "Version
# packages" PR (version-packages.yml) bumps all twelve in lockstep with
# their changelogs, and that lands on master through development and
# staging like any other change. The release tag (v*, cut from master)
# then publishes what the tagged commit says:
#
#   node scripts/release-packages.js publish --provenance
#
# builds every package from the tagged checkout in dependency order (client,
# auth and mcp-mux, then the CLIs that use the client, then almyty-cli),
# each against the in-repo build of its @almyty/* dependencies rather than
# the copy on npm, and only once every build passed publishes the ones npm
# does not have yet, dependencies first. A version already on npm is
# skipped, so re-running a release, or a tag with no version change, is a
# no-op. The published manifests name each internal dependency as
# ^<the version it was built against>.
#
# Publishing stays in THIS file: npm's trusted publisher for each package is
# bound to this repository and the workflow filename publish-packages.yml.
# Authentication is npm OIDC (id-token: write below), with provenance; no
# NPM_TOKEN. Requires npm >= 11.5.
#
# workflow_dispatch is the manual fallback: publish the committed versions
# of every package (or one, plus nothing else), or a throwaway
# <version>-next.<run> of all twelve to the `next` dist-tag. It never bumps
# or commits anything.
#
# After a publish, post-release.yml raises the internal ranges, refreshes
# the lockfiles and recaptures the CLI help screenshots.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (packages/<dir>), or all'
        required: true
        type: choice
        options:
          - all
          - acp-server
          - agents-cli
          - almyty-cli
          - auth-cli
          - chat-cli
          - client
          - credentials-cli
          - mcp-mux
          - mcp-server
          - models-cli
          - runner
          - skills-cli
      dist_tag:
        description: 'npm dist-tag channel (latest = prod, next = prerelease of all twelve)'
        required: true
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @almyty/* in dependency order
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Releases are cut from master (development -> staging -> master).
      - name: Refuse a tag that is not on master
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF_NAME is not on master; packages publish only from master's history"
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: npm with trusted publishing
        run: npm install -g npm@latest

      # Every repo invariant, the version lockstep among them, before
      # anything is built.
      - name: npm run check
        run: npm run check

      - name: Build and publish
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -- --provenance
          if [ "$PACKAGE" != "all" ]; then set -- "$@" --only "$PACKAGE"; fi
          if [ "$DIST_TAG" = "next" ]; then set -- "$@" --prerelease "next.$RUN_NUMBER"; fi
          node scripts/release-packages.js publish "$@"
