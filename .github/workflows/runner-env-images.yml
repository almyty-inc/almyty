name: Runner env images

# Builds the curated hosted-runner images (images/runner-env: standard,
# standard-browser, node, python) whenever they or the runner change, and
# checks each one starts the way a hosted pod starts it. Nothing is pushed
# from a PR or from development.
#
#   build   every PR and push that touches images/runner-env, packages/runner
#           or this file.
#   push    master and v* tags only, like build-publish.yml and release.yml.
#           Builds the same way, smoke-tests the result again, and tags it
#           almyty/runner-env:<flavour>-<RUNNER_VERSION>.
#
# Both jobs install the runner from THIS checkout: `npm pack` of
# packages/runner into the `runner-pkg` build context. So a change to the
# runner is exercised in the image before it ships, and a release builds
# the images for a runner version npm does not have yet; the image build
# refuses a runner whose version is not the Dockerfile's RUNNER_VERSION,
# which must equal packages/runner's (scripts/check-runner-env-images.js).
#
# Bumping the runner: bump RUNNER_VERSION in the Dockerfile with the
# packages and leave settings.json alone; the release builds and pushes the
# new images; then pin their digests in settings.json, the backend defaults
# and image-prepull.yaml. Until then every reference stays on the last
# pushed digest.

on:
  pull_request:
    branches: [development, staging, master]
    paths:
      - 'images/runner-env/**'
      - 'packages/runner/**'
      - '.github/workflows/runner-env-images.yml'
  push:
    branches: [development, master]
    # Path filters are not evaluated for tag pushes, so every v* tag runs.
    tags: ['v*']
    paths:
      - 'images/runner-env/**'
      - 'packages/runner/**'
      - '.github/workflows/runner-env-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-env-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build runner-env (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, standard-browser, node, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: packages/runner/package-lock.json

      - name: Pack the runner from this checkout
        working-directory: packages/runner
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/runner-pkg"
          npm pack --pack-destination "$RUNNER_TEMP/runner-pkg"
          mv "$RUNNER_TEMP"/runner-pkg/almyty-runner-*.tgz "$RUNNER_TEMP/runner-pkg/almyty-runner.tgz"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./images/runner-env
          file: ./images/runner-env/Dockerfile
          target: ${{ matrix.flavour }}
          build-contexts: runner-pkg=${{ runner.temp }}/runner-pkg
          platforms: linux/amd64
          load: true
          push: false
          tags: runner-env-ci:${{ matrix.flavour }}
          cache-from: type=gha,scope=runner-env-${{ matrix.flavour }}
          cache-to: type=gha,scope=runner-env-${{ matrix.flavour }},mode=max

      # The pod's own terms: uid 1000, read-only root, no capabilities,
      # /tmp and /workspace the only writable places. Without an API it must
      # fail enrollment and exit non-zero, which is what makes Kubernetes
      # restart it; the coding CLIs and the browser must start too. The same
      # script runs locally after a `docker build`.
      - name: Smoke test as the hosted pod runs it
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: images/runner-env/smoke.sh "runner-env-ci:$FLAVOUR" "$FLAVOUR"

  push:
    name: Push runner-env (${{ matrix.flavour }})
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, standard-browser, node, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: packages/runner/package-lock.json

      - name: Resolve the pinned runner version
        id: pin
        run: |
          VERSION=$(sed -n 's/^ARG RUNNER_VERSION=//p' images/runner-env/Dockerfile)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=almyty/runner-env:${{ matrix.flavour }}-$VERSION" >> "$GITHUB_OUTPUT"

      # The published image carries the runner built from this commit, the
      # same as the build job, so it does not wait for npm to have the
      # version. The tag names that version: refuse a pack whose version is
      # not the Dockerfile's (the image build refuses it too).
      - name: Pack the runner from this checkout
        working-directory: packages/runner
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::packages/runner is $PACKAGE_VERSION but the Dockerfile's RUNNER_VERSION is $VERSION"
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/runner-pkg"
          npm pack --pack-destination "$RUNNER_TEMP/runner-pkg"
          mv "$RUNNER_TEMP"/runner-pkg/almyty-runner-*.tgz "$RUNNER_TEMP/runner-pkg/almyty-runner.tgz"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built and loaded first, so it is tested before anything leaves the
      # runner.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./images/runner-env
          file: ./images/runner-env/Dockerfile
          target: ${{ matrix.flavour }}
          build-contexts: runner-pkg=${{ runner.temp }}/runner-pkg
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.pin.outputs.tag }}
          cache-from: type=gha,scope=runner-env-${{ matrix.flavour }}

      # The same checks as the build job, on the image that is pushed:
      # it enrolls, fails without an API, and its tools start.
      - name: Smoke test the image to push
        env:
          FLAVOUR: ${{ matrix.flavour }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: images/runner-env/smoke.sh "$TAG" "$FLAVOUR"

      - name: Push
        run: docker push "${{ steps.pin.outputs.tag }}"