name: Build & Publish Images

# Builds multi-arch container images and publishes them to Docker Hub
# (public: almyty/api, almyty/frontend, almyty/docs), then fires a
# a deployment dispatch to roll out the new tag.
#
# This runs alongside the legacy GHCR deploy-api/frontend/docs workflows
# until cutover — it does NOT deploy to the cluster itself.

on:
  push:
    branches: [development, staging, master]
    # NOT on v* tags — release.yml owns tagged builds (semver images +
    # prod deploy). build-publish on a tag mis-resolves the ref as `dev`
    # and duplicates the release build, so it stays branch-only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve metadata
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.m.outputs.environment }}
      env_prefix: ${{ steps.m.outputs.env_prefix }}
      sha_tag: ${{ steps.m.outputs.sha_tag }}
      latest_tag: ${{ steps.m.outputs.latest_tag }}
      is_branch: ${{ steps.m.outputs.is_branch }}
      api_url: ${{ steps.m.outputs.api_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tags
        id: m
        run: |
          # Canonical tag scheme (all images: api/frontend/docs/almyty):
          #   moving env tag       = <pfx>            (dev|staging|prod)
          #   immutable build tag  = <pfx>-<shortsha> (12-char sha)
          # `latest` is NOT published here — it means "newest stable release"
          # and is minted only by release.yml on v* tags.
          # API_URL is baked into the frontend at build time (ALMYTY_API_BASE_URL).
          # Missing it = the SPA calls http://localhost:3000 and prod login breaks.
          case "${{ github.ref_name }}" in
            master)      ENV=production;  PFX=prod;    API_URL="https://api.almyty.com" ;;
            staging)     ENV=staging;     PFX=staging; API_URL="https://api.staging.almyty.com" ;;
            development) ENV=development;  PFX=dev;     API_URL="https://api.dev.almyty.com" ;;
            *)           ENV=development;  PFX=dev;     API_URL="https://api.dev.almyty.com" ;;
          esac
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "env_prefix=$PFX" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${PFX}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$PFX" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "branch" ]; then
            echo "is_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_branch=false" >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'k8s/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs-site/**'

  build-api:
    name: Build & push api (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [meta, changes]
    # Always build on tag pushes / manual dispatch; on branch pushes only
    # when backend or k8s changed.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each arch builds on its own native runner and pushes by digest; the
      # manifest job below stitches them into the moving env tag (dev|staging|
      # prod). They used to cross-build arm64 under qemu on an amd64 runner,
      # where `npm ci` ran for ~170s and on 2026-09-22 died with ECONNRESET,
      # failing the whole job. docs and almyty already build natively for the
      # same reason.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=almyty/api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.platform }}
          cache-to: type=gha,scope=api-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: api-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-api-manifest:
    name: Build & push api (manifest)
    needs: [meta, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: api-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "almyty/api:${TAG}" \
            $(printf 'almyty/api@sha256:%s ' *)
        env:
          TAG: ${{ needs.meta.outputs.latest_tag }}

  build-frontend:
    name: Build & push frontend (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [meta, changes]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Native per-arch build + manifest, same as api above.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/${{ matrix.platform }}
          build-args: |
            ALMYTY_API_BASE_URL=${{ needs.meta.outputs.api_url }}
            ALMYTY_POSTHOG_KEY=${{ vars.ALMYTY_POSTHOG_KEY }}
            ALMYTY_POSTHOG_HOST=/ingest
            ALMYTY_SENTRY_DSN=${{ vars.ALMYTY_SENTRY_DSN }}
            ALMYTY_TURNSTILE_SITE_KEY=${{ vars.ALMYTY_TURNSTILE_SITE_KEY }}
          outputs: type=image,name=almyty/frontend,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}
          cache-to: type=gha,scope=frontend-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-frontend-manifest:
    name: Build & push frontend (manifest)
    needs: [meta, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: frontend-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "almyty/frontend:${TAG}" \
            $(printf 'almyty/frontend@sha256:%s ' *)
        env:
          TAG: ${{ needs.meta.outputs.latest_tag }}

  build-docs:
    name: Build docs (${{ matrix.platform }})
    needs: [meta, changes]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docs-site
          file: ./docs-site/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=almyty/docs,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docs-${{ matrix.platform }}
          cache-to: type=gha,scope=docs-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docs-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-docs-manifest:
    name: Build & push docs
    runs-on: ubuntu-latest
    needs: [meta, build-docs]
    if: needs.build-docs.result == 'success'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docs-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "almyty/docs:${TAG}" \
            $(printf 'almyty/docs@sha256:%s ' *)
        env:
          TAG: ${{ needs.meta.outputs.latest_tag }}

  # All-in-one self-host image. Same native-arch split as docs: qemu-cross
  # arm64 hangs on npm ci / native addons. Off the deploy critical path.
  # Self-host SPA is same-origin, so ALMYTY_API_BASE_URL stays empty.
  # Built only on tag pushes and manual dispatch (not every branch push).
  build-almyty:
    name: Build almyty (${{ matrix.platform }})
    needs: [meta, changes]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.allinone
          target: production
          platforms: linux/${{ matrix.platform }}
          build-args: |
            ALMYTY_API_BASE_URL=
            ALMYTY_POSTHOG_KEY=${{ vars.ALMYTY_POSTHOG_KEY }}
            ALMYTY_POSTHOG_HOST=/ingest
            ALMYTY_SENTRY_DSN=${{ vars.ALMYTY_SENTRY_DSN }}
            ALMYTY_TURNSTILE_SITE_KEY=${{ vars.ALMYTY_TURNSTILE_SITE_KEY }}
          outputs: type=image,name=almyty/almyty,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=almyty-${{ matrix.platform }}
          cache-to: type=gha,scope=almyty-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: almyty-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-almyty-manifest:
    name: Build & push almyty (single self-host image)
    runs-on: ubuntu-latest
    needs: [meta, build-almyty]
    if: needs.build-almyty.result == 'success'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: almyty-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "almyty/almyty:${TAG}" \
            $(printf 'almyty/almyty@sha256:%s ' *)
        env:
          TAG: ${{ needs.meta.outputs.latest_tag }}

  dispatch-deploy:
    name: Dispatch deployment
    runs-on: ubuntu-latest
    # Only on branch pushes (the env→branch mapping); tags publish images
    # but production rollout of a release is intentionally manual.
    #
    # Fire ONLY when at least one image was actually built+pushed this run.
    # A push touching no backend/frontend/docs code skips every build job; we
    # must NOT dispatch a deploy for an image tag that was never built (the
    # rollout would then fail pulling a non-existent tag). `always()` keeps this job
    # evaluating even though some needed build jobs are skipped.
    #
    # NOTE: build-almyty is intentionally NOT a dependency here. The all-in-one
    # image is slow to build and only ships to self-hosters via releases; the
    # SaaS rollout only pulls the api + frontend images, so it must not wait on
    # build-almyty. That job keeps building independently off the critical path.
    #
    # These depend on the MANIFEST jobs, not the per-arch build jobs. The
    # per-arch jobs push by digest only; the moving tag (dev|staging) does
    # not exist until the manifest is created, so dispatching on the build
    # jobs would tell the cluster to pull a tag that is not there yet.
    needs: [meta, build-api-manifest, build-frontend-manifest, build-docs-manifest]
    # Only dev/staging auto-deploy on push, pinned to their moving env tag.
    # Production is NOT deployed here — it deploys from release.yml on a
    # version tag (git tag v0.1.4) so prod always runs a named semver.
    if: |
      always() &&
      needs.meta.outputs.is_branch == 'true' &&
      github.ref_type == 'branch' &&
      github.ref_name != 'master' &&
      (
        needs.build-api-manifest.result == 'success' ||
        needs.build-frontend-manifest.result == 'success' ||
        needs.build-docs-manifest.result == 'success'
      )
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          DEPLOY_TARGET_REPOSITORY: ${{ secrets.DEPLOY_TARGET_REPOSITORY }}
          ENVIRONMENT: ${{ needs.meta.outputs.environment }}
          MOVING_TAG: ${{ needs.meta.outputs.latest_tag }}
        run: |
          # Deploy dev/staging by their moving env tag (dev|staging). No digest.
          : "${DEPLOY_TARGET_REPOSITORY:?Deployment target is not configured}"
          gh api "repos/${DEPLOY_TARGET_REPOSITORY}/dispatches" \
            -f event_type=deploy \
            -F client_payload[environment]="$ENVIRONMENT" \
            -F client_payload[image_tag]="$MOVING_TAG"
