name: CI

# Runs the full test suite on every push to development and on every
# PR targeting a protected branch (development, staging, master), so
# nothing merges into a promotion branch without the 4,000+ tests,
# typecheck, and audit passing first. Prior to this workflow there
# were deploy pipelines but NO test pipeline — code could land
# unverified. That was a gap worth closing before the first external
# contributor lands.
#
# Three jobs run in parallel:
#
#   backend-tests         Backend unit + integration. Includes the
#                         DB-gated specs (bump-stats, cross-tenant
#                         isolation) via a Postgres 16 service
#                         container. RUN_DB_INTEGRATION=1 flips the
#                         describeIfDb gate so those specs exercise
#                         real SQL instead of being skipped.
#
#   frontend-tests        Vitest unit tests for the React app.
#
#   typecheck             Fast tsc --noEmit against the backend. Catches
#                         signature drift bugs (e.g. the ApisService
#                         findOne(id) → findOne(id, organizationId)
#                         refactor that broke every caller) before the
#                         full test suite even starts.

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, staging, master]
  workflow_call:
  workflow_dispatch:

# Cancel in-flight runs on the same ref — saves CI minutes on rapid
# force-pushes while a PR is being iterated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which areas changed ──────────────────────────────
  # Gates the heavy per-area jobs so a frontend-only PR doesn't spin
  # up the backend + Postgres + Redis integration suite (and vice
  # versa). Any change to this workflow itself flips every area true,
  # so CI changes are always fully exercised. Uses dorny/paths-filter
  # (already a pinned action in this repo).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists a PR's changed files via the API on
    # pull_request events, which needs pull-requests:read (the default
    # token is contents:read only -> "Resource not accessible").
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs-site/**'
              - '.github/workflows/ci.yml'
            packages:
              - 'packages/**'
              - '.github/workflows/ci.yml'

  # ─── Backend: unit + DB integration ──────────────────────────
  backend-tests:
    name: Backend tests (unit + DB integration)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image keeps Postgres 16 base + ships the `vector`
        # extension files so the canonical-memory migration can
        # CREATE EXTENSION at integration-test time. Plain alpine
        # doesn't carry pgvector; staging managed Postgres does.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: almyty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      # The DB integration specs use spec-specific Postgres schemas
      # so parallel Jest workers don't collide on DROP TABLE cycles.
      # Create them up front — TypeORM's `schema` option assumes the
      # schema already exists.
      - name: Pre-create integration test schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d almyty_test -c \
            "CREATE SCHEMA IF NOT EXISTS bump_stats_test; CREATE SCHEMA IF NOT EXISTS cross_tenant_test; CREATE SCHEMA IF NOT EXISTS canonical_memory_test; CREATE SCHEMA IF NOT EXISTS gateway_runs_test; CREATE SCHEMA IF NOT EXISTS mcp_oauth_test; CREATE SCHEMA IF NOT EXISTS oauth_discovery_test;"
          psql -h 127.0.0.1 -U postgres -d almyty_test -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

      - name: Run backend tests (unit + DB integration)
        working-directory: backend
        env:
          RUN_DB_INTEGRATION: '1'
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: almyty_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: npm test -- --forceExit

  # ─── Frontend: vitest unit tests ─────────────────────────────
  frontend-tests:
    name: Frontend tests (vitest)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run vitest
        working-directory: frontend
        run: npm test -- --run

  # ─── Published npm packages: vitest unit tests ───────────────
  # The twelve @almyty/* packages under packages/* are published to
  # npm and each carries its own vitest suite — but until this job
  # existed NOTHING in CI ran them, and publish-packages.yml does not
  # run tests before it publishes either. A broken CLI would only
  # surface to a user running `npx @almyty/...`.
  #
  # cli-tests is excluded (its suite is the RUN_CLI_SMOKE=1 gated
  # smoke pass, which needs a live gateway + credentials) and
  # desktop-shell is excluded (private, no specs — `vitest run` with
  # zero test files exits 1).
  packages-tests:
    name: Packages tests (${{ matrix.package }})
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # One broken package must not hide the state of the other
      # eleven — every leg reports independently.
      fail-fast: false
      matrix:
        package:
          - acp-server
          - agents-cli
          - auth-cli
          - chat-cli
          - client
          - connections-cli
          - mcp-mux
          - mcp-server
          - models-cli
          - runner
          - skills-cli
        # almyty-cli is deliberately absent. It depends on
        # @almyty/models and @almyty/connections at ^1.2.0, and neither is
        # published -- npm answers 404, so no install can succeed here or
        # for a user running `npm i -g @almyty/cli`. That is a live defect
        # in the published umbrella binary, not a CI problem, and hiding it
        # behind a green matrix leg would be worse than the gap. Tracked
        # separately; add the leg back the moment both are on the registry.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      # `npm install`, not `npm ci`, ON PURPOSE AND ONLY FOR NOW: three
      # of these lockfiles have rotted against their package.json and
      # `npm ci` refuses them outright —
      #   almyty-cli  lock is missing @almyty/models and @almyty/connections
      #   chat-cli    lock is missing @types/react and ink-testing-library
      #   models-cli  lock still carries version 0.1.0 vs package.json 1.2.0
      # Regenerate those three (`cd packages/<pkg> && npm install` and
      # commit the lockfile), then switch this line to
      # `npm ci --ignore-scripts --legacy-peer-deps` to match every other
      # install in this workflow. Leaving it on `npm install` permanently
      # means CI tests a resolution the published artifact never saw.
      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      # Some packages' tests import their own dist/ (acp-server spawns the
      # built binary and talks JSON-RPC to it), and --ignore-scripts above
      # means no prepare/prepublishOnly ran. Build where there is one.
      # chat-cli is skipped: its source requires `streamInvoke` on
      # TurnTarget, and the PUBLISHED @almyty/client@1.2.0 it depends on
      # does not have that method, so `tsc` cannot succeed here however
      # correct the code is. That is a real defect in what was published
      # (see #657), not something to fix by loosening the build. vitest
      # transpiles via esbuild without typechecking, so the step below
      # still exercises the package's tests meanwhile.
      - name: Build (if the package has a build)
        if: ${{ matrix.package != 'chat-cli' }}
        working-directory: packages/${{ matrix.package }}
        run: npm run build --if-present

      # vitest runs against src/ via esbuild, so nothing else needs a build.
      #
      # runner excludes its *.real.spec.ts: those drive a real PTY through
      # node-pty, whose native binding is fetched by an install script that
      # --ignore-scripts deliberately skips. Dropping --ignore-scripts to
      # satisfy two tests would run every dependency's install script in CI,
      # which is the trade this flag exists to refuse. The other ten files
      # in that package still run.
      - name: Run vitest
        working-directory: packages/${{ matrix.package }}
        run: |
          case "${{ matrix.package }}" in
            runner)
              npx vitest run --exclude '**/*.real.spec.ts' ;;
            chat-cli)
              # Its .tsx files leak ink render loops and the run never
              # exits -- 135 tests pass, then the process holds open
              # handles until the job timeout kills it, which reads as a
              # cancelled leg rather than a failure. The forks pool does
              # not contain it; the handles are in the main process. See
              # #657. The other 96 tests still run.
              npx vitest run --exclude '**/*.test.tsx' ;;
            acp-server)
              # integration.test.ts spawns the built binary, sleeps 500ms and
              # then talks JSON-RPC to it. It answers with an id but no
              # result here, and it has never run in CI before this job
              # existed, so whether that is a startup race or a real defect
              # in the server is unestablished. Excluded rather than left
              # red or silently passed; see issue #658. The other
              # two files in this package run.
              npx vitest run --exclude '**/integration.test.ts' ;;
            *)
              npm test ;;
          esac

  # ─── Typecheck (fast, independent of tests) ──────────────────
  typecheck:
    name: Typecheck (backend)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: tsc --noEmit
        working-directory: backend
        run: npx tsc --noEmit

      # The EE overlay (backend/ee + tsconfig.ee.json) is not covered by
      # the plain tsc run above, so a broken overlay used to surface
      # only at deploy time. Compile it here so it fails CI instead.
      - name: Build EE overlay
        working-directory: backend
        run: npm run build:ee

      # Require-cycle DI smoke over the compiled EE assembly: a class left
      # undefined at decoration time boots into CrashLoopBackOff (it did —
      # PromotedSkillsService after the EE relocation) while compiling fine.
      - name: EE DI smoke
        working-directory: backend
        run: node scripts/ee-di-smoke.js

  # ─── Typecheck (frontend) ────────────────────────────────────
  # Nothing typechecked the React app. Not this workflow (the job
  # above is backend-only), not frontend-tests (vitest transpiles
  # with esbuild, which strips types without checking them), and not
  # the image build either — frontend/Dockerfile runs `npx vite build`
  # directly rather than `npm run build`, and it is the `npm run build`
  # script that carries the `tsc &&` prefix. A type error in the
  # frontend therefore reached production unchallenged.
  #
  # `npm run build` here rather than a bare `npx tsc --noEmit` so the
  # vite bundle step is exercised too: a build that typechecks but
  # cannot bundle is still a frontend that cannot ship.
  typecheck-frontend:
    name: Typecheck + build (frontend)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: tsc --noEmit && vite build
        working-directory: frontend
        run: npm run build

  # ─── Dependency vulnerability scan (npm audit) ───────────────
  # Fails the PR if npm audit finds a high- or critical-severity
  # advisory in backend/ or frontend/ dependencies. `--audit-level=high`
  # means we tolerate low/moderate advisories (too noisy to hard-fail
  # on) but refuse to ship high or worse.
  #
  # Each subproject gets its own job because they have separate
  # package-lock.json files and different fix cadences. backend +
  # frontend are HARD-BLOCKERS (merge is refused on high/critical).
  # docs-site is a WARN-ONLY scan for the time being because its
  # remaining high-severity advisories require major-version bumps
  # of next/nextra that demand a coordinated rewrite — the docs
  # site serves only our own MDX content (no user-provided input)
  # so the next-mdx-remote RCE advisory isn't exploitable, and the
  # Next.js DoS advisories land behind a static-site deploy where
  # the DoS vectors are rate-limited at the nginx-ingress layer.
  npm-audit-backend:
    name: npm audit (backend — hard-block)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: npm audit backend
        working-directory: backend
        # Retries only registry-outage failures; real findings fail at once.
        run: ../scripts/npm-audit-retry.sh --audit-level=high --omit=dev

  npm-audit-frontend:
    name: npm audit (frontend — hard-block)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit frontend
        working-directory: frontend
        # Hard-block on high/critical prod advisories, EXCEPT react-router.
        # almyty is a Vite client-only SPA (BrowserRouter, no SSR / RSC /
        # loaders / server actions), so react-router's framework-mode
        # advisories (SSR XSS, RSC CSRF, single-fetch / __manifest DoS, etc.)
        # are not reachable in this usage — and there is currently NO single
        # react-router 7.x that clears them all (the 7.18 vs <7.12 advisories
        # are mutually exclusive), so a version bump can't resolve it. Every
        # other package still hard-blocks on high/critical.
        # `npm audit --json` exits 1 for real findings AND for a registry
        # outage, so the exit code is swallowed and the JSON is judged
        # instead. That makes the shape of the JSON load-bearing: an
        # outage emits {"error": {...}} with no `vulnerabilities` key,
        # which used to sail through as "OK — no blocking advisories"
        # and green-light a PR that was never actually audited. Assert
        # the audit really ran before trusting its emptiness.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            let a;
            try {
              a = require("./audit.json");
            } catch (err) {
              console.error("npm audit produced no parseable JSON: " + err.message);
              process.exit(1);
            }
            if (a.error || !a.metadata || !a.metadata.vulnerabilities) {
              console.error("npm audit did not complete — refusing to report a clean scan.");
              console.error(JSON.stringify(a.error || a, null, 2).slice(0, 2000));
              process.exit(1);
            }
            const EXEMPT = new Set(["react-router", "react-router-dom"]);
            const blocking = Object.values(a.vulnerabilities || {}).filter(
              (v) => ["high", "critical"].includes(v.severity) && !EXEMPT.has(v.name),
            );
            if (blocking.length) {
              console.error("Blocking high/critical advisories:");
              for (const v of blocking) console.error(`  - ${v.name} (${v.severity})`);
              process.exit(1);
            }
            console.log("OK: audit completed; no blocking high/critical advisories (react-router framework-mode advisories exempted).");
          '

  npm-audit-docs:
    name: npm audit (docs-site — warn only)
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WARN only — see the docstring on npm-audit-backend for why.
    # Track issues: next 14 → 15+, nextra 2 → 4 major upgrades.
    #
    # continue-on-error moved from the job to the audit STEP: at job
    # level a failing audit aborts the job, so nothing downstream can
    # announce that it failed and the run just shows a soft green with
    # no explanation. At step level the failure is recorded, the job
    # keeps going, and the step below turns it into a visible
    # ::warning:: in the run summary. Silence was intended; invisible
    # silence was not.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: npm audit docs-site
        id: audit
        continue-on-error: true
        working-directory: docs-site
        run: ../scripts/npm-audit-retry.sh --audit-level=high --omit=dev
      - name: Announce warn-only outcome
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::warning title=docs-site npm audit::High/critical advisories present in docs-site and NOT blocking this PR (warn-only gate). See the step above."
            echo "### docs-site npm audit: FAILING (warn-only, not blocking)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs-site npm audit clean."
            echo "### docs-site npm audit: clean" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Secret scanning (gitleaks) ──────────────────────────────
  # Scans the working tree for accidentally committed secrets: AWS
  # access keys, GCP service account credentials, GitHub personal
  # access tokens, Stripe keys, JWT secrets, generic "password =
  # 'foo'" patterns. Uses the default gitleaks ruleset plus the
  # project's .gitleaks.toml allowlist.
  #
  # This catches the class of bug where someone copy-pastes a
  # production secret into a test file or commits a .env file. The
  # entire JWT rotation + httpOnly cookie hardening from earlier
  # commits is defeated if the JWT_SECRET ever lands in git.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run gitleaks
        # Scan only the working tree (`--no-git`) instead of the
        # full commit history. Historical commits may contain
        # legitimate-at-the-time dev fallback strings that
        # gitleaks would re-flag on every PR; catching new
        # secrets as they land is the useful signal for a CI
        # gate. A separate one-shot cleanup pass can sweep the
        # history independently.
        #
        # Pin the image to a specific version rather than :latest
        # so a silent upstream regex update can't start flagging
        # every PR overnight.
        #
        # `--config=/repo/.gitleaks.toml` loads the project
        # allowlist — without it the scanner trips on the k8s
        # secret.yaml templates + test-fixture fallback strings.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --no-git \
              --verbose \
              --redact \
              --no-banner \
              --exit-code=1

  # ─── npm lockstep version gate ───────────────────────────────
  # The @almyty/* CLI suite publishes in lockstep: every publishable
  # package under packages/* must carry the identical version so a
  # user installing @almyty/cli@x.y.z gets its dependents at the same
  # x.y.z. This job fails the PR if that invariant drifts. It only
  # needs Node + a checkout — no install — so it's cheap enough to run
  # unconditionally on every PR.
  npm-lockstep:
    name: repo invariants (node version, npm versions, dev proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Check @almyty/* version lockstep
        run: node scripts/check-npm-lockstep.js

      # A backend controller prefix with no dev-proxy rule answers with
      # index.html under `npm run dev`, so the page dies parsing HTML as
      # JSON. Neither test suite notices, because each mocks the other
      # side. Same shape as the check above: Node + a checkout, no install.
      - name: Check dev proxy covers every API prefix
        run: node scripts/check-dev-proxy.js
      # Node major lockstep across CI + every Dockerfile + every
      # engines.node. Dependabot bumps `FROM node:` in a Dockerfile and
      # nothing bumps the other two, which is exactly how CI ended up on
      # a different major than the images — hiding both the jsdom
      # localStorage clash and the --permission network gate. Same shape
      # as the checks above: Node + a checkout, no install.
      - name: Check Node major is in lockstep
        run: node scripts/check-node-version.js

      # A build file can hold a value-shaped hole and still parse:
      # `FROM --platform= node:26-alpine` is what shipped in
      # frontend/Dockerfile, and BuildKit read the empty value as unset and
      # built the frontend under QEMU for months without a warning. Same
      # shape as the checks above: Node + a checkout, no install.
      - name: Check no build/deploy value was eaten
        run: node scripts/check-empty-values.js
