name: Release

# Tagged releases (v1.2.3). Builds multi-arch images, publishes them to
# Docker Hub as almyty/*:X.Y.Z and :latest, signs them with cosign
# (keyless / OIDC), attaches an SBOM, and records build provenance.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for cosign keyless signing (OIDC)

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # api and frontend build on NATIVE runners per architecture, then a
  # manifest job stitches the two digests into one multi-arch tag.
  #
  # They used to build linux/amd64,linux/arm64 together on ubuntu-latest,
  # which meant the arm64 half ran under qemu emulation: `npm ci` took
  # about 170 seconds and, on 2026-09-22, died with ECONNRESET partway
  # through and failed the whole build. The docs and self-host images
  # already had this split for exactly that reason; the release matrix
  # never got it. Every production node is amd64, so the arm64 image is
  # for people self-hosting on Apple Silicon or Graviton, and it should
  # not be slowing down or breaking their amd64 release.
  release:
    name: Release ${{ matrix.image }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      # Spelled out rather than built from two lists plus `include`:
      # include-merging silently produces a different set when a key is
      # added, and a release is the wrong place to discover that.
      matrix:
        include:
          - image: api
            platform: amd64
            runner: ubuntu-latest
            context: ./backend
            file: ./backend/Dockerfile
            target: production
          - image: api
            platform: arm64
            runner: ubuntu-24.04-arm
            context: ./backend
            file: ./backend/Dockerfile
            target: production
          - image: frontend
            platform: amd64
            runner: ubuntu-latest
            context: ./frontend
            file: ./frontend/Dockerfile
            target: production
          - image: frontend
            platform: arm64
            runner: ubuntu-24.04-arm
            context: ./frontend
            file: ./frontend/Dockerfile
            target: production
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          provenance: true
          sbom: true
          # Frontend needs these baked in at build time (only the frontend
          # Dockerfile consumes them; other images ignore them). Releases are
          # production, so point the SPA at the prod API — WITHOUT this the
          # bundle defaults to http://localhost:3000 and prod login/reset break.
          build-args: |
            ALMYTY_API_BASE_URL=https://api.almyty.com
            ALMYTY_POSTHOG_KEY=${{ vars.ALMYTY_POSTHOG_KEY }}
            ALMYTY_POSTHOG_HOST=/ingest
            ALMYTY_SENTRY_DSN=${{ vars.ALMYTY_SENTRY_DSN }}
            ALMYTY_TURNSTILE_SITE_KEY=${{ vars.ALMYTY_TURNSTILE_SITE_KEY }}
          outputs: type=image,name=almyty/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.image }}-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The semver tags are only created here, once BOTH architectures have
  # pushed. That is deliberate: a half-built release never claims a tag,
  # so `almyty/api:latest` cannot briefly point at an amd64-only image.
  release-manifest:
    name: Release ${{ matrix.image }} (manifest)
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
    steps:
      - name: Resolve version
        id: ver
        run: |
          # Semver from the tag: v1.2.3 -> 1.2.3, 1.2, 1 (+ latest).
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-${{ matrix.image }}-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push (all semver tags)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "almyty/${IMAGE}:${VERSION}" \
            -t "almyty/${IMAGE}:${MINOR}" \
            -t "almyty/${IMAGE}:${MAJOR}" \
            -t "almyty/${IMAGE}:latest" \
            $(printf "almyty/${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.ver.outputs.version }}
          MINOR: ${{ steps.ver.outputs.minor }}
          MAJOR: ${{ steps.ver.outputs.major }}

  # Docs (Next.js/nextra) is built OUTSIDE the `release` matrix and off the
  # prod-deploy critical path: its static-generation workers crash under qemu
  # with SIGILL when arm64 is cross-built on an amd64 runner, and gating the
  # prod rollout on that flake once already skipped a release. Build each arch
  # natively (amd64 on ubuntu-latest, arm64 on the free public-repo
  # ubuntu-24.04-arm runner), push by digest, then stitch the semver tags.
  release-docs:
    name: Release docs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docs-site
          file: ./docs-site/Dockerfile
          platforms: linux/${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: type=image,name=almyty/docs,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docs-${{ matrix.platform }}
          cache-to: type=gha,scope=docs-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-docs-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-docs-manifest:
    name: Release docs (manifest)
    needs: release-docs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-docs-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push (all semver tags)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "almyty/docs:${VERSION}" \
            -t "almyty/docs:${MINOR}" \
            -t "almyty/docs:${MAJOR}" \
            -t "almyty/docs:latest" \
            $(printf 'almyty/docs@sha256:%s ' *)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MINOR: ${{ steps.ver.outputs.minor }}
          MAJOR: ${{ steps.ver.outputs.major }}

  # All-in-one self-host image (almyty/almyty). Same native-arch split as
  # docs: qemu-cross arm64 on ubuntu-latest hangs (npm ci / native addons
  # for frontend+backend, and branch builds never cache this image). Off
  # the prod-deploy critical path — SaaS pulls api + frontend only.
  # Self-host SPA talks same-origin, so ALMYTY_API_BASE_URL stays empty
  # (do NOT bake https://api.almyty.com).
  release-almyty:
    name: Release almyty (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.allinone
          target: production
          platforms: linux/${{ matrix.platform }}
          provenance: true
          sbom: true
          build-args: |
            ALMYTY_API_BASE_URL=
            ALMYTY_POSTHOG_KEY=${{ vars.ALMYTY_POSTHOG_KEY }}
            ALMYTY_POSTHOG_HOST=/ingest
            ALMYTY_SENTRY_DSN=${{ vars.ALMYTY_SENTRY_DSN }}
            ALMYTY_TURNSTILE_SITE_KEY=${{ vars.ALMYTY_TURNSTILE_SITE_KEY }}
          outputs: type=image,name=almyty/almyty,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=almyty-${{ matrix.platform }}
          cache-to: type=gha,scope=almyty-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-almyty-digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-almyty-manifest:
    name: Release almyty (manifest)
    needs: release-almyty
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-almyty-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push (all semver tags)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "almyty/almyty:${VERSION}" \
            -t "almyty/almyty:${MINOR}" \
            -t "almyty/almyty:${MAJOR}" \
            -t "almyty/almyty:latest" \
            $(printf 'almyty/almyty@sha256:%s ' *)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MINOR: ${{ steps.ver.outputs.minor }}
          MAJOR: ${{ steps.ver.outputs.major }}

  # Trigger the production rollout. This does NOT deploy — it only fires a
  # deployment dispatch; the deployment pipeline owns the actual cluster
  # rollout (migration, kubectl, smoke, rollback). Same pattern as
  # build-publish.yml for dev/staging. We pass the semver tag so the rollout
  # pins almyty/api:<version> and kubectl shows the running version.
  #
  # Intentionally needs ONLY `release` (api + frontend). NOT release-docs
  # and NOT release-almyty: prod pulls api + frontend. Gating rollout on
  # docs (qemu SIGILL) or the all-in-one image (qemu hang on v0.1.9) skips a release.
  trigger-prod-deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deployment (by version tag)
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          DEPLOY_TARGET_REPOSITORY: ${{ secrets.DEPLOY_TARGET_REPOSITORY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Deploying production at almyty/*:${VERSION}"
          : "${DEPLOY_TARGET_REPOSITORY:?Deployment target is not configured}"
          gh api "repos/${DEPLOY_TARGET_REPOSITORY}/dispatches" \
            -f event_type=deploy \
            -F client_payload[environment]="production" \
            -F client_payload[image_tag]="${VERSION}"

  # Create the GitHub Release object so tags self-document (release.yml
  # otherwise only publishes images). Idempotent — edits if it exists.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --generate-notes --latest
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest --verify-tag
          fi
