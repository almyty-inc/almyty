name: Post-release

# The follow-up every release used to need by hand (docs/releasing.md),
# opened as one PR against development once its inputs exist:
#
#   - internal @almyty/* ranges raised to ^<released version> and every
#     package-lock.json refreshed from npm (only once npm has the version;
#     until then the lockfiles could not resolve it);
#   - the six CLI help screenshots recaptured from the published binaries
#     (scripts/capture-cli-help.js, the recipe docs-site/SCREENSHOTS.md
#     requires);
#   - the runner-env references in settings.json, the backend defaults and
#     the pre-pull DaemonSet pinned to the pushed images' digests (only
#     once all four flavours are on Docker Hub).
#
# It runs after each npm publish and each runner-env image push, so a
# release triggers it twice: whichever finishes second finds both inputs
# and the PR carries everything. Each run starts again from development,
# so it is idempotent, and it does nothing when nothing is out of date.
#
# The PR is opened with RELEASE_PR_TOKEN when that secret is set (a
# fine-grained token or GitHub App token with contents and pull-requests
# write). A PR opened with the default GITHUB_TOKEN does not start CI; close
# and reopen it to run the checks. Review the recaptured images before
# merging.

on:
  workflow_run:
    workflows: ['Publish npm Packages', 'Runner env images']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: post-release
  cancel-in-progress: false

jobs:
  post-release:
    name: Open or update the post-release PR
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      FREEZE_VERSION: '0.2.2'
      FREEZE_SHA256: 012fdbdd16c0c19570f9052aac34d16d93d7d0d3b565b05374cc59492f53539b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: development
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - uses: docker/setup-buildx-action@v4

      - name: Released version
        id: v
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@almyty/client@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "@almyty/* $VERSION is not on npm yet: ranges and CLI help wait for the release"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise internal ranges and refresh the lockfiles
        if: steps.v.outputs.published == 'true'
        run: node scripts/release-packages.js raise-ranges

      - name: Install freeze
        if: steps.v.outputs.published == 'true'
        run: |
          TARBALL="freeze_${FREEZE_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$TARBALL" "https://github.com/charmbracelet/freeze/releases/download/v${FREEZE_VERSION}/$TARBALL"
          echo "${FREEZE_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/freeze_${FREEZE_VERSION}_Linux_x86_64/freeze" /usr/local/bin/freeze
          freeze --version

      # --stale: only the images whose manifest entry names another version
      # than package.json, so a re-run on an unchanged tree renders nothing.
      - name: Recapture the CLI help screenshots
        if: steps.v.outputs.published == 'true'
        run: node scripts/capture-cli-help.js --from npm --register --stale

      - name: Pin the runner-env digests
        run: node scripts/release-packages.js pin-runner-env

      - name: Open or update the PR
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Nothing to follow up for $VERSION."
            exit 0
          fi
          BRANCH="release/post-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "Follow up the @almyty/* $VERSION release"
          git push --force origin "$BRANCH"
          BODY=$(printf '%s\n' \
            "Automated follow-up to the @almyty/* $VERSION release (post-release.yml):" \
            "" \
            "$(git show --stat --format="" HEAD)" \
            "" \
            "Review the recaptured CLI help images before merging.")
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$BODY"
          else
            gh pr create --base development --head "$BRANCH" --title "Follow up the @almyty/* $VERSION release" --body "$BODY"
          fi
