name: Bug report
description: Something in almyty does not work the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please check the open issues first in case someone already has.
        If the problem is a security vulnerability, do not file it here: see SECURITY.md and report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the error message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence of steps that shows the problem.
      placeholder: |
        1. Open Agents and create a new agent
        2. Add a tool step with ...
        3. Run it
        4. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      multiple: true
      options:
        - Hosted app (app.almyty.com)
        - Self-hosted (Docker Compose)
        - Self-hosted (Kubernetes)
        - CLI or MCP server (@almyty/* npm packages)
        - Runner
        - Agent channel (web chat, widget, messaging app, A2A)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The almyty version or image tag, or the npm package version (for example `almyty --version`).
      placeholder: "v0.2.30, or @almyty/cli 1.5.16"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, or the LLM provider involved, whichever matters here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or a run ID. Remove keys, tokens and personal data before pasting.
      render: shell
