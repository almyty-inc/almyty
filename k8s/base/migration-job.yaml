apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  labels:
    app: almyty
    component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      # Same hardening baseline as the api deployment. The migration
      # job uses the same image and the same `nestjs` user (uid 1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: almyty/api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          # This is the only container in the repo that had NO resource
          # block, which put the pod in the BestEffort QoS class: it is
          # the first thing the kubelet evicts under node pressure, and
          # it is the job the rollout is gated on. An evicted migration
          # reads as a migration failure. Limits match the api pod's
          # ceiling so nothing that fits there can fail here.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          command: ["./node_modules/.bin/typeorm", "migration:run", "-d", "dist-ee/src/config/database.config.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: almyty-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: almyty-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: almyty-config
                  key: DATABASE_NAME
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: almyty-secrets
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: almyty-secrets
                  key: DATABASE_PASSWORD
            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: almyty-config
                  key: DB_SSL
            # Credential encryption key — the migration path
            # reads/writes Credential rows during
            # CredentialSystemUpgrade (1744100000000). Same
            # required-in-production contract as the api pod.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: almyty-secrets
                  key: ENCRYPTION_KEY
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
