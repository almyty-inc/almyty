services:
  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: almyty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API
  backend:
    # Self-hosters can pull the published image (docker compose pull);
    # local dev builds from source via the build context below.
    image: almyty/api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_NAME=almyty
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  # Frontend
  frontend:
    # Self-hosters can pull the published image (docker compose pull);
    # local dev builds from source via the build context below.
    image: almyty/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Without an explicit target, `docker compose up` built the LAST
      # stage — production, which is nginx:1.31-alpine on :8080 with no
      # node and no npm. The `command: npm run dev` below then died on
      # an image that has no npm, and the port mapping pointed at 3000
      # which nginx does not listen on. The backend service has always
      # named its target; this one never did.
      target: development
    ports:
      # The development stage's CMD serves vite on 3000 bound to
      # 0.0.0.0 (a bare `npm run dev` binds loopback inside the
      # container and is unreachable from the host, which is why there
      # is no `command:` override here any more).
      - "4001:3000"
    environment:
      - ALMYTY_API_BASE_URL=http://localhost:4000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: llm-gateway-network